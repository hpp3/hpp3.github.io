<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>hpp3</title>
        <!-- Google takes one site name and one favicon per hostname, from this
             page, for everything under hpp3.github.io (/puz, /rw3, ...).
             Sheet2Puz's own browser tab still falls back to /favicon.ico. -->
        <link rel="icon" type="image/png" sizes="98x98" href="/site-icon.png">
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "hpp3",
          "url": "https://hpp3.github.io/"
        }
        </script>
    </head>
    <body>
        <p>
        Hello! There's not too much here right now.
        </p>
        Are you looking for <a href="puz">Sheet2Puz</a>, a tool for converting Google Sheets crosswords into .puz files?
    </body>
</html>
